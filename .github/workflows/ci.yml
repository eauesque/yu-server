name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # This job exists to catch a broken mirror. `crates/` is meant to be
      # self-contained, and there are two ways that can quietly stop being true:
      #
      #   - at compile time, if something reaches outside the crate with
      #     include_str!/include_bytes! (Cargo's dependency graph never sees
      #     those, so `cargo metadata` can resolve on a tree that will not
      #     compile);
      #   - at test time, if a test climbs out of CARGO_MANIFEST_DIR to read a
      #     fixture. That one survives `cargo check` entirely.
      #
      # `--all-targets` builds the test targets too, which is what makes the
      # second case visible here.
      - name: cargo check
        working-directory: crates
        run: cargo check --workspace --all-targets

      - name: cargo fmt
        working-directory: crates
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: crates
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Not run: `cargo test`. Five tests in yu-server invoke the Python
      # implementation to check cross-language agreement, and that
      # implementation lives in yu_ai_manager rather than here. They are
      # comparisons with no counterpart present, not failures of the Rust code.
      # Everything else passes; see the README.
